<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PCIL RAG Console</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="bg"></div>
  <main class="shell">
    <header class="hero">
      <div class="badge">PCIL</div>
      <h1>Production Context Intelligence</h1>
      <p class="subtitle">
        Run the pipeline and review RAG recovery guidance for the
        inkjet printer context window.
      </p>
      <div class="actions">
        <button id="runBtn" class="primary">Run Pipeline</button>
        <span id="status" class="status">Idle</span>
      </div>
    </header>

    <section class="grid">
      <article class="card recommendation">
        <h2>Operator Recommendation</h2>
        <p id="recommendation" class="muted">No run yet.</p>
      </article>

      <article class="card context">
        <h2>Context Window</h2>
        <div id="contextWindow" class="meta muted">No data yet.</div>
      </article>
    </section>

    <section class="card records">
      <div class="records-header">
        <h2>Recovery Records</h2>
        <span id="recordCount" class="chip">0</span>
      </div>
      <div id="records" class="record-list muted">No records yet.</div>
    </section>

    <section class="card raw">
      <div class="raw-header">
        <h2>Raw Response</h2>
        <button id="toggleRaw" class="ghost">Show JSON</button>
      </div>
      <pre id="rawJson" class="raw-json hidden"></pre>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
