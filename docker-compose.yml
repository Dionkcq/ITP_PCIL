# PCIL Job Orchestrator — docker-compose deployment
# ---------------------------------------------------
# Quick start (full guide in DEPLOYMENT.md):
#   1. Put the provided data/ folder next to this file (or set PCIL_DATA_DIR
#      in a .env file next to this one).
#   2. Optional: add GEMINI_API_KEY=<key> to that same .env for live LLM
#      recommendations.
#   3. docker compose pull   (or: docker compose build, from a repo checkout)
#   4. docker compose up -d
#   5. Open http://localhost:8000/dashboard/  (API docs at /docs)
#
# Variables (read from .env next to this file):
#   PCIL_IMAGE     image to run     (default ghcr.io/dionkcq/itp_pcil:postgres
#                                    — the postgre_implementation image; main's
#                                    CSV build stays at :latest)
#   PCIL_PORT      host port        (default 8000)
#   PCIL_DATA_DIR  host data folder (default ./data)
#   GEMINI_API_KEY Gemini key       (default empty -> fallback recommendation)
#   POSTGRES_PASSWORD required for the private pgvector service

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pcil-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pcil}
      POSTGRES_USER: ${POSTGRES_USER:-pcil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pcil_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pcil} -d ${POSTGRES_DB:-pcil}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  pcil:
    # Prefer pulling the prebuilt image; `docker compose build` rebuilds it
    # from this repo instead (multi-stage build, needs internet for npm+pip).
    image: ${PCIL_IMAGE:-ghcr.io/dionkcq/itp_pcil:postgres}
    build: .
    container_name: pcil-orchestrator
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PCIL_PORT:-8000}:8000"
    environment:
      # Only the Gemini key is forwarded into the container. Deliberately NOT
      # env_file: a full .env could carry PCIL_PROJECT_ROOT, which must stay
      # at the image's baked-in /app inside the container.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-pcil}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-pcil}
      RAG_BACKEND: ${RAG_BACKEND:-postgres}
      RAG_AUTO_INGEST: ${RAG_AUTO_INGEST:-true}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      RAG_RRF_K: ${RAG_RRF_K:-60}
      RAG_STRICT_STARTUP: ${RAG_STRICT_STARTUP:-false}
      # Auto-seed the shop-floor table from the mounted CSV on startup so the
      # default recipe (systems/inkjet_printer/config.yaml, source_type:
      # postgres) has data to query. Idempotent: skipped once the table has rows.
      PCIL_SEED_SHOP_FLOOR: ${PCIL_SEED_SHOP_FLOOR:-true}
      PCIL_SHOP_FLOOR_TABLE: ${PCIL_SHOP_FLOOR_TABLE:-shop_floor}
      PCIL_SHOP_FLOOR_CSV: ${PCIL_SHOP_FLOOR_CSV:-data/mock_shop_floor.csv}
    volumes:
      # Runtime data the image does NOT contain (shipped separately, not in
      # git): mock_shop_floor.csv, <model_type>_<model_id>.pkl bundles,
      # RAG/*.docx recovery documents.
      - ${PCIL_DATA_DIR:-./data}:/app/data
      # Config recipes, mounted so edits made in the dashboard's Config tab
      # (or with a text editor on the host) persist across container
      # restarts and apply on the next API call — no rebuild needed. The
      # image carries a baked-in copy as fallback, but mounting is the
      # supported deployment path.
      - ${PCIL_SYSTEMS_DIR:-./systems}:/app/systems
      # Keep Hugging Face embedding-model files across container rebuilds.
      - hf_cache:/root/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  pcil_pgdata:
  hf_cache:
