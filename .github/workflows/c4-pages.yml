# Build the LikeC4 interactive architecture sites and publish them to GitHub Pages.
# ONE Pages site, TWO sub-path pages (one per branch):
#   /ITP_PCIL/          -> landing chooser (docs/c4/landing/index.html)
#   /ITP_PCIL/main/     -> main (CSV) model      (docs/c4/main/pcil.c4)
#   /ITP_PCIL/postgres/ -> Postgres-branch model (docs/c4/postgres/pcil.c4)
# Runs on any push that touches docs/c4/ (or this file), and on manual dispatch.
name: Deploy C4 site (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "docs/c4/**"
      - ".github/workflows/c4-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deploys at once.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # LikeC4 is run via npx only - it is NOT a project dependency.
      # `build` produces a static SPA (no headless browser needed).
      # Each model is built into its own sub-path; --base must match it.
      # The two models live in separate folders so their element ids never
      # clash (LikeC4 scans a build folder recursively).
      - name: Build main (CSV) architecture
        run: npx -y likec4@1.58.0 build docs/c4/main -o _site/main --base /ITP_PCIL/main/
      - name: Build Postgres-branch architecture
        run: npx -y likec4@1.58.0 build docs/c4/postgres -o _site/postgres --base /ITP_PCIL/postgres/
      - name: Add landing chooser page
        run: cp docs/c4/landing/index.html _site/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
