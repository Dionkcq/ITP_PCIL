# ============================================================
# PCIL Pipeline #1 — config.yaml  (Week-3 schema, PostgreSQL source)
# ============================================================
# This is the DEFAULT recipe on the postgre_implementation branch: the
# shop-floor slice is pulled from the dockerized PostgreSQL service, not a
# local CSV. For the file/CSV alternative, use config_csv.yaml (or set
# source_type: csv here).
#
#   trigger.source_type: postgres   -> _pull_slice queries the DB
#   trigger.table:       shop_floor -> the table to read
#   trigger.source:      data/mock_shop_floor.csv
#                                    -> the CSV used to SEED that table
#                                       (POST /shopfloor/seed, or auto-seed on
#                                       startup when PCIL_SEED_SHOP_FLOOR=true).
#                                       In production the engineer's DB already
#                                       holds the data, so seeding is off and
#                                       this CSV is unused.
#
# The DB connection comes from DATABASE_URL (set by docker-compose), so no
# secrets live in this file. Downstream stages are identical to the CSV recipe.
# ============================================================

# ── System identity ─────────────────────────────────────────
# Goes into context_model_impacts.json -> "system". Use a name
# that describes the scope (single machine, full lab, project).
system: inkjet_printer

# ── Pipeline settings ───────────────────────────────────────
pipeline:
  output_dir: "output"            # relative to this config file's parent

# ── Trigger / slice parameters ──────────────────────────────
# source_type=postgres maps the slice mode to SQL:
#   mode = "all"        -> SELECT * ... ORDER BY timestamp
#   mode = "time_range" -> ... WHERE timestamp BETWEEN start_time AND end_time
#   mode = "last_n"     -> ... ORDER BY timestamp DESC LIMIT last_n
trigger:
  source_type: postgres
  table: shop_floor
  source: "data/mock_shop_floor.csv"   # seed origin for /shopfloor/seed
  mode: "all"
  start_time: null              # ISO 8601 UTC, e.g. "2026-05-15T09:00:30+00:00"
  end_time: null                # ISO 8601 UTC
  last_n: null                  # positive integer

# ── Input schema: shop-floor DataFrame slice ────────────────
# What the trigger pulls. The preprocessing pipeline expects these
# columns to exist on the input DataFrame (table columns or CSV headers).
input:
  timestamp_column: timestamp

  # Numerical sensor / process / score columns. Each becomes one
  # feature in the Golden DataFrame after MinMaxScaler.
  numerical_features:
    - air_pressure_low_ratio
    - cycle_stop_present
    - vibration
    - acoustic_emission
    - setpressure_cycle_count
    - setvelo_mean
    - cyclical_anomaly_score
    - acoustic_anomaly_score

  # Categorical context columns. Each becomes one or more one-hot
  # features in the Golden DataFrame after OneHotEncoder.
  categorical_features: []

  # Target columns the context model regresses on. Passed through
  # unchanged — they are computed upstream (engineering team) and
  # already live in the shop-floor DB.
  targets:
    - availability
    - performance
    - quality
    - oee

# ── Feature descriptions (for the impacts JSON + LLM) ───────
# One short, plain-English line per feature. The orchestrator
# attaches these to ranked_feature_impacts so the LLM doesn't
# have to guess what e.g. "setpressure_cycle_count" means.
feature_descriptions:
  air_pressure_low_ratio: "Proportion of operating time during which air pressure falls below the defined threshold."
  cycle_stop_present: "Whether a cycle interruption event occurred during the observation window (0 or 1)."
  vibration: "Aggregated vibration signal (RMS over the window) from the machine accelerometer."
  acoustic_emission: "Aggregated acoustic emission signal (RMS over the window) from the AE sensor."
  setpressure_cycle_count: "Number of distinct pressure setpoint changes observed in the window."
  setvelo_mean: "Mean commanded velocity setpoint over the observation window."
  cyclical_anomaly_score: "Anomaly score from the cyclical pipeline, aggregated to the canonical row rate."
  acoustic_anomaly_score: "Anomaly score from the non-cyclical / acoustic pipeline, aggregated to the canonical row rate."

# ── Output: Golden DataFrame ────────────────────────────────
# The contract Pipeline #2 (adapter + context model) reads.
# Column order: timestamp + targets + features (post-ColumnTransformer).
# All feature values land in [0, 1] (adapter's range invariant).
